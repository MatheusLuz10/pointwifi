<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Simulador Inteligente de Planta | Point WiFi</title>
    <meta name="description" content="Monte a planta aproximada da sua casa em poucos minutos e simule a cobertura de Wi-Fi. Gratuito, sem cadastro, funciona offline.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===================== CABEÇALHO ===================== -->
    <header class="app-header">
        <a href="../index.html" class="app-header__back">← Voltar ao site</a>
        <div class="app-header__row">
            <div class="app-header__title">
                <span class="app-header__icon">🏗️</span>
                <div>
                    <h1>Minha Planta</h1>
                    <p>Monte sua casa e simule a cobertura de Wi-Fi</p>
                </div>
            </div>
            <div class="app-header__actions">
                <button type="button" class="icon-btn" id="btn-report" aria-label="Ver relatório">📊</button>
                <button type="button" class="icon-btn" id="btn-clear" aria-label="Limpar tudo">🗑️</button>
            </div>
        </div>
    </header>

    <!-- ===================== ÁREA DE EDIÇÃO ===================== -->
    <main class="editor">
        <div class="editor__stage" id="stage">
            <canvas id="plant-canvas"></canvas>
        </div>

        <p class="editor__hint" id="editor-hint">Toque em um ambiente na barra abaixo para começar a montar sua planta.</p>

        <!-- Barra contextual do item selecionado -->
        <div class="context-bar" id="context-bar" hidden>
            <span class="context-bar__label" id="context-bar-label">Cômodo selecionado</span>
            <div class="context-bar__actions">
                <button type="button" data-action="rotate" aria-label="Girar 90°">↻ Girar</button>
                <button type="button" data-action="duplicate" aria-label="Duplicar">⧉ Duplicar</button>
                <button type="button" data-action="delete" aria-label="Excluir">🗑️ Excluir</button>
                <button type="button" data-action="deselect" aria-label="Fechar seleção">✕</button>
            </div>
        </div>
    </main>

    <!-- ===================== AÇÕES PRINCIPAIS ===================== -->
    <div class="action-bar">
        <button type="button" class="btn btn--primary" id="btn-coverage">📡 Ver cobertura</button>
        <button type="button" class="btn btn--whatsapp" id="btn-whatsapp">💬 Enviar para a Point WiFi</button>
    </div>

    <!-- ===================== BARRA DE FERRAMENTAS (INFERIOR, MOBILE) ===================== -->
    <nav class="toolbar" id="toolbar" aria-label="Ferramentas da planta">
        <div class="toolbar__scroll">

            <button type="button" class="tool" data-tool="room" data-room-type="sala">
                <span class="tool__icon">🏠</span><span class="tool__label">Sala</span>
            </button>
            <button type="button" class="tool" data-tool="room" data-room-type="quarto">
                <span class="tool__icon">🛏️</span><span class="tool__label">Quarto</span>
            </button>
            <button type="button" class="tool" data-tool="room" data-room-type="cozinha">
                <span class="tool__icon">🍳</span><span class="tool__label">Cozinha</span>
            </button>
            <button type="button" class="tool" data-tool="room" data-room-type="banheiro">
                <span class="tool__icon">🚿</span><span class="tool__label">Banheiro</span>
            </button>
            <button type="button" class="tool" data-tool="room" data-room-type="garagem">
                <span class="tool__icon">🚗</span><span class="tool__label">Garagem</span>
            </button>
            <button type="button" class="tool" data-tool="room" data-room-type="varanda">
                <span class="tool__icon">🌳</span><span class="tool__label">Varanda</span>
            </button>
            <button type="button" class="tool" data-tool="room" data-room-type="escritorio">
                <span class="tool__icon">🖥️</span><span class="tool__label">Escritório</span>
            </button>
            <button type="button" class="tool" data-tool="room" data-room-type="lavanderia">
                <span class="tool__icon">📦</span><span class="tool__label">Lavanderia</span>
            </button>
            <button type="button" class="tool" data-tool="room" data-room-type="outro">
                <span class="tool__icon">➕</span><span class="tool__label">Outro</span>
            </button>

            <span class="toolbar__divider"></span>

            <button type="button" class="tool" data-tool="network" data-network-type="router">
                <span class="tool__icon">📡</span><span class="tool__label">Roteador</span>
            </button>
            <button type="button" class="tool" data-tool="network" data-network-type="ap">
                <span class="tool__icon">📶</span><span class="tool__label">Access Point</span>
            </button>

            <span class="toolbar__divider"></span>

            <button type="button" class="tool" data-tool="device" data-device-type="celular">
                <span class="tool__icon">📱</span><span class="tool__label">Celular</span>
            </button>
            <button type="button" class="tool" data-tool="device" data-device-type="notebook">
                <span class="tool__icon">💻</span><span class="tool__label">Notebook</span>
            </button>
            <button type="button" class="tool" data-tool="device" data-device-type="tv">
                <span class="tool__icon">📺</span><span class="tool__label">Smart TV</span>
            </button>
            <button type="button" class="tool" data-tool="device" data-device-type="console">
                <span class="tool__icon">🎮</span><span class="tool__label">Console</span>
            </button>
            <button type="button" class="tool" data-tool="device" data-device-type="impressora">
                <span class="tool__icon">🖨️</span><span class="tool__label">Impressora</span>
            </button>

            <span class="toolbar__divider"></span>

            <button type="button" class="tool" data-tool="door">
                <span class="tool__icon">🚪</span><span class="tool__label">Porta</span>
            </button>
            <button type="button" class="tool" data-tool="window">
                <span class="tool__icon">🪟</span><span class="tool__label">Janela</span>
            </button>

        </div>
    </nav>

    <!-- ===================== MODAL: RELATÓRIO ===================== -->
    <div class="modal" id="report-modal" hidden>
        <div class="modal__overlay" id="report-overlay"></div>
        <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="report-title">
            <button type="button" class="modal__close" id="report-close" aria-label="Fechar">✕</button>
            <h2 id="report-title">Relatório da sua planta</h2>

            <div class="report-grid" id="report-grid"></div>

            <div class="report-section" id="report-critical"></div>
            <div class="report-section" id="report-suggestions"></div>

            <div class="modal__actions">
                <button type="button" class="btn btn--outline" id="btn-export-json">⬇️ Exportar JSON</button>
                <button type="button" class="btn btn--outline" id="btn-export-png">🖼️ Exportar PNG</button>
            </div>
        </div>
    </div>

    <!-- ===================== TOAST (feedback rápido) ===================== -->
    <div class="toast" id="toast" hidden></div>

    <script src="js/script.js"></script>
</body>
</html>
